<sly data-sly-use.imageTpl="core/cif/components/commerce/productteaser/v1/productteaser/image.html"
     data-sly-use.titleTpl="core/cif/components/commerce/productteaser/v1/productteaser/title.html"/>
<div id="title-linked">
    <sly data-sly-call="${imageTpl.actions @ product=properties, titleLinked=true}"/>
    <sly data-sly-call="${titleTpl.actions @ product=properties}"/>
</div>
<div id="title-not-linked">
    <sly data-sly-call="${imageTpl.actions @ product=properties, titleLinked=false}"/>
    <sly data-sly-call="${titleTpl.actions @ product=properties}"/>
</div>
<div id="title-linked-omitted">
    <sly data-sly-call="${imageTpl.actions @ product=properties}"/>
    <sly data-sly-call="${titleTpl.actions @ product=properties}"/>
</div>
