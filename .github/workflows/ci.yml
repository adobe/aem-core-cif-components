# GitHub Actions counterpart to .circleci/config.yml's "build-and-release" workflow
# (build-java-11/8, karma, jest*, integration-test-*, selenium-chrome-*).
#
# This is additive: .circleci/config.yml keeps running as-is. All CI/build/deploy
# scripting for this workflow lives under .github/scripts (ci.js, build.js, it-tests.js,
# settings.xml, run-containerized-test.sh) as forks of the .circleci/ci/*.js and
# .circleci/settings.xml originals, so the two pipelines stay independent of each other
# rather than one reaching into the other's folder. it-tests.js differs from its CircleCI
# counterpart in scoping a couple of `mvn` calls to avoid full-reactor resolution (see its
# own comments) and re-basing configuration.json's module paths onto this job's actual
# workspace path; ci.js and build.js are otherwise unchanged copies. Networking is back to
# matching CircleCI exactly (AEM_HOST defaults to `localhost`) now that the test-aem job
# runs both containers with --network host via run-containerized-test.sh - see that job's
# own comment for why.
#
# Required secrets (see PR description for the full list / setup notes):
#   ARTIFACTORY_CLOUD_USER, ARTIFACTORY_CLOUD_PASS  - private Adobe registry + Maven repo auth

name: CI

on:
  push:
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Open a tmate SSH session into the test-aem runner after the integration/selenium step (like CircleCI''s "rerun with SSH")'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  build:
    name: build (jdk ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['11', '8']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # Confirms matrix.java actually resolved to the intended JDK. node/npm aren't
      # printed here: frontend-maven-plugin downloads its own pinned Node per module
      # rather than using the system one, so the system version isn't actually in play.
      - name: Debug context
        run: |
          java -version
          mvn -v

      # Forked verbatim from .circleci/ci/build.js - collects module metadata, runs
      # `mvn clean install`, copies surefire XML into test-results/junit.
      - name: Build
        run: node .github/scripts/build.js

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-jdk${{ matrix.java }}
          path: test-results/junit
          if-no-files-found: ignore
          retention-days: 14

      # Publishes a Checks-tab entry with pass/fail/skip counts and inline annotations,
      # the closest GitHub Actions equivalent to CircleCI's "Tests" insights tab.
      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Unit Tests (jdk ${{ matrix.java }})
          path: test-results/junit/*.xml
          reporter: java-junit
          fail-on-error: false

      # Only the JDK 11 build's output feeds the integration/selenium jobs below
      # (mirrors CircleCI's persist_to_workspace, which only build-java-11 does).
      - name: Upload build output
        if: matrix.java == '11'
        uses: actions/upload-artifact@v5
        with:
          name: build-output
          retention-days: 3
          path: |
            configuration.json
            bundles/core/target
            ui.apps/target/*.zip
            ui.config/target/*.zip
            extensions/product-recs/bundle/target
            extensions/product-recs/content/target/*.zip
            examples/bundle/target
            examples/ui.apps/target/*.zip
            examples/ui.config/target/*.zip
            examples/ui.content/target/*.zip
            it/content/target/*.zip

      - name: Upload coverage to Codecov
        if: matrix.java == '11'
        uses: codecov/codecov-action@v6
        with:
          flags: unittests
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  karma:
    name: karma (ui.apps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '16.17.1'

      - name: Debug context
        run: |
          node -v
          npm -v
          google-chrome --version || true
          firefox --version || true

      - name: Provision
        working-directory: ./ui.apps
        run: |
          npm install
          npm run webpack:dev

      - name: Run Unit Tests (Karma)
        working-directory: ./ui.apps
        run: npm test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: karma-junit
          path: ui.apps/karma-junit
          if-no-files-found: ignore

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Unit Tests (karma)
          path: ui.apps/karma-junit/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          flags: karma
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  jest:
    name: jest (react-components)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '16.20.0'

      - name: Provision
        working-directory: ./react-components
        run: npm ci --legacy-peer-deps

      - name: Run Unit Tests (Jest)
        working-directory: ./react-components
        run: npm run ci

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: jest-test-results
          path: react-components/test-results
          if-no-files-found: ignore

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Unit Tests (jest react-components)
          path: react-components/test-results/*.xml
          reporter: jest-junit
          fail-on-error: false

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          flags: jest
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  jest-extension-product-recs:
    name: jest (extensions/product-recs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '16.17.1'

      - name: Provision (Core)
        working-directory: ./react-components
        run: |
          npm install
          npm run webpack:dev
          npm link

      - name: Provision (Extension)
        working-directory: ./extensions/product-recs/react-components
        run: |
          npm install
          npm link @adobe/aem-core-cif-react-components --legacy-peer-deps

      - name: Run Unit Tests (Jest)
        working-directory: ./extensions/product-recs/react-components
        run: npm run ci

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: jest-product-recs-test-results
          path: extensions/product-recs/react-components/test-results
          if-no-files-found: ignore

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Unit Tests (jest extensions/product-recs)
          path: extensions/product-recs/react-components/test-results/*.xml
          reporter: jest-junit
          fail-on-error: false

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          flags: jest
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  jest-extension-experience-platform-connector:
    name: jest (extensions/experience-platform-connector)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '16.17.1'

      - name: Provision (Extension)
        working-directory: ./extensions/experience-platform-connector
        run: npm install --legacy-peer-deps

      - name: Run Unit Tests (Jest)
        working-directory: ./extensions/experience-platform-connector
        run: npm run ci

      # No "Publish test results" step here (unlike the other jest jobs): this package's
      # `ci` script only runs lint + prettier:check, not jest, so no jest-junit XML is ever
      # produced under test-results/. dorny/test-reporter errors out when its glob matches
      # zero files, unlike CircleCI's store_test_results which silently no-ops on an empty
      # directory - so adding it here would fail the job for no real reason.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: jest-epc-test-results
          path: extensions/experience-platform-connector/test-results
          if-no-files-found: ignore

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          flags: jest
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # Mirrors integration-test-{655,660,cloudready-with-addon} and
  # selenium-chrome-{655,660,cloudready-with-addon} from .circleci/config.yml as a single
  # matrix job instead of 6 near-duplicated ones. Each combination pulls the same private
  # Adobe images CircleCI uses: a "qp" image as the job container (ships the AEM quickstart
  # jar + qp.sh control CLI baked in at /home/circleci/cq) and an "aem" image as a service
  # container (runs the actual AEM instance CircleCI reaches at `localhost` because its
  # docker executor shares one network namespace across primary/secondary containers).
  #
  # GitHub Actions' `container:` + `services:` keys cannot be used here: QuickProvider's RMI
  # protocol advertises "localhost" as its own callback address, which only works if the qp
  # and aem containers share one network namespace (--network host), exactly like CircleCI's
  # machine executor. Combining --network host with a `services:` container crashes the
  # runner before the job even starts ("Error: Value cannot be null. (Parameter
  # 'ContainerId')"). So this job runs directly on the bare runner and drives both
  # containers itself via run-containerized-test.sh, which sidesteps GitHub Actions'
  # service-container orchestration entirely. (aem-cif-guides-venia hit and solved this
  # exact problem first - see its .github/ci/run-containerized-test.sh.)
  test-aem:
    name: ${{ matrix.type }} (${{ matrix.aem }})
    needs:
      - build
      - karma
      - jest
      - jest-extension-product-recs
      - jest-extension-experience-platform-connector
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        type: [integration, selenium]
        include:
          - aem: classic
            qp_image: docker-adobe-cif-release.dr-uw2.adobeitc.com/circleci-qp:6.4.6-openjdk11
            aem_image: docker-adobe-cif-release.dr-uw2.adobeitc.com/circleci-aem:6.5.24.0-openjdk11
          - aem: lts
            qp_image: docker-adobe-cif-release.dr-uw2.adobeitc.com/circleci-qp:6.4.7-openjdk21
            aem_image: docker-adobe-cif-release.dr-uw2.adobeitc.com/circleci-aem-lts:6.6.2-openjdk21
          - aem: addon
            qp_image: docker-adobe-cif-release.dr-uw2.adobeitc.com/circleci-qp:6.4.7-openjdk21
            aem_image: docker-adobe-cif-release.dr-uw2.adobeitc.com/circleci-aem-cloudready:26125-openjdk21
    env:
      AEM: ${{ matrix.aem }}
      TYPE: ${{ matrix.type }}
      BROWSER: chrome
      QP_IMAGE: ${{ matrix.qp_image }}
      AEM_IMAGE: ${{ matrix.aem_image }}
      ARTIFACTORY_CLOUD_USER: ${{ secrets.ARTIFACTORY_CLOUD_USER }}
      ARTIFACTORY_CLOUD_PASS: ${{ secrets.ARTIFACTORY_CLOUD_PASS }}
      # Optional: it-tests.js already handles these being unset (skips configuring the
      # examples GraphQL client against a live Commerce backend). Wiring them here only
      # takes effect once matching repo secrets are actually created with real values.
      COMMERCE_ENDPOINT: ${{ secrets.COMMERCE_ENDPOINT }}
      COMMERCE_INTEGRATION_TOKEN: ${{ secrets.COMMERCE_INTEGRATION_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      # These steps run directly on the bare runner (they're not `uses:` inside the qp
      # container), so this path is the runner's own ~/.m2/repository - the same directory
      # run-containerized-test.sh bind-mounts into the qp container's /root/.m2, since that
      # container runs as --user root. (Caching /root/.m2/repository directly, without that
      # bind mount, doesn't work: it's either the container's own ephemeral layer - gone the
      # moment --rm removes it - or the *host's* actual /root, which the unprivileged
      # default runner user can't access at all.) No cache is shared with the build job
      # (different runner), unlike CircleCI's restore_cache/save_cache working off the same
      # key. Without this, it/site's standalone build (and the various install-file/
      # download-maven-plugin calls in it-tests.js) re-download their entire dependency tree
      # from scratch on every run. Shared across all matrix.aem/type combinations - they all
      # need the same underlying dependencies.
      #
      # Split into restore/save (instead of the combined actions/cache@v4) because the
      # combined action's save step only runs if the job succeeds - while this job is still
      # failing for unrelated reasons, a plain actions/cache@v4 would never persist anything,
      # even after re-downloading the entire dependency tree. actions/cache/save with
      # if: always() below saves whatever got downloaded regardless of outcome.
      #
      # CACHE_VERSION mirrors CircleCI's `{{ .Environment.CACHE_VERSION }}` prefix in
      # maven-repo-*: a manually-bumped repository/organization Variable (Settings > Secrets
      # and variables > Actions > Variables), not something defined here, so it can be
      # changed later to force a fresh cache lineage without a code change. Defaults to '1'
      # until that Variable is created. restore-keys stays scoped to the same
      # CACHE_VERSION - it never falls back across a version bump, matching CircleCI.
      - name: Restore Maven repository cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.m2/repository
          key: test-aem-m2-${{ vars.CACHE_VERSION || '1' }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            test-aem-m2-${{ vars.CACHE_VERSION || '1' }}-

      - uses: actions/download-artifact@v6
        with:
          name: build-output

      # Drives both the qp and aem containers directly (see job-level comment); the
      # script's own trap dumps the aem container's logs into this step's output on exit,
      # success or failure, so there's finally real visibility into it - unlike the
      # `services:` approach, GitHub Actions doesn't hide these from us anymore.
      - name: Integration/UI tests
        run: bash .github/scripts/run-containerized-test.sh

      # GitHub Actions equivalent of CircleCI's "Rerun job with SSH": opens a tmate SSH
      # session into this runner. Opt-in only, via workflow_dispatch, so it never blocks a
      # normal push/PR run. Note: unlike the old services:-based setup, the aem container
      # is torn down by run-containerized-test.sh's own cleanup trap as soon as that step
      # exits, so this session can inspect the runner/workspace state but not a live AEM
      # instance.
      - name: Debug via SSH (tmate)
        if: always() && github.event_name == 'workflow_dispatch' && inputs.debug_enabled
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true
        timeout-minutes: 30

      # actions/cache/save only ever warns on failure, never fails the step (see the
      # restore step's comment) - so verify the directory it's about to save is actually
      # populated and ours first, and fail loudly if not, rather than let a broken
      # bind-mount/permission setup hide as an easy-to-miss orange warning again.
      - name: Verify Maven cache is populated
        if: always()
        run: |
          m2_repo=~/.m2/repository
          if [ ! -d "${m2_repo}" ] || [ -z "$(find "${m2_repo}" -mindepth 1 -print -quit)" ]; then
            echo "::error::${m2_repo} is missing or empty - the cache save below will persist nothing."
            echo "::error::Expected if the job failed before run-containerized-test.sh ran; otherwise this means its ~/.m2:/root/.m2 bind mount or ownership is broken again."
            exit 1
          fi
          echo "${m2_repo} is populated: $(find "${m2_repo}" -type f | wc -l) files, $(du -sh "${m2_repo}" | cut -f1)."
          ls -la "${m2_repo}"

      # Saves the cache even if the job above failed, so a failing run still leaves behind
      # whatever it managed to download for the next attempt (see restore step's comment).
      - name: Save Maven repository cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: ~/.m2/repository
          key: test-aem-m2-${{ vars.CACHE_VERSION || '1' }}-${{ hashFiles('**/pom.xml') }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.type }}-${{ matrix.aem }}-reports
          if-no-files-found: ignore
          path: |
            it/http/target/failsafe-reports
            ui.tests/test-module/reports
            logs
            bundles/core/target/site/jacoco
            extensions/product-recs/bundle/target/site/jacoco
            examples/bundle/target/site/jacoco

      # Same Checks-tab reporting as the other jobs; only one of these two globs matches
      # per matrix.type (integration -> failsafe-reports, selenium -> ui.tests reports).
      #
      # TEST-*.xml, not *.xml: maven-failsafe-plugin also writes failsafe-summary.xml into
      # this directory, a separate aggregate-counts file with no <testsuite> structure at
      # all. dorny/test-reporter's JUnit parser crashes trying to read it as if it were a
      # per-test report ("Cannot read properties of undefined (reading '$')").
      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Tests (${{ matrix.type }} ${{ matrix.aem }})
          path: 'it/http/target/failsafe-reports/TEST-*.xml,ui.tests/test-module/reports/**/*.xml'
          reporter: java-junit
          fail-on-error: false

      - name: Upload coverage to Codecov
        if: matrix.type == 'integration'
        uses: codecov/codecov-action@v6
        with:
          flags: integration
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
