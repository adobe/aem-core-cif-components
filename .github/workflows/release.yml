# Release workflow: runs the `release` and `deploy-queries` jobs. Triggered only by the
# release tag `mvn release:prepare` creates, never by branch pushes.
#
# `release` and `deploy-queries` each run their own full `mvn clean deploy` /
# `mvn clean verify` rather than reusing a prior build - the `build` job here is a gate
# (must pass before either runs), not an artifact source.
#
# Required secrets:
#   ARTIFACTORY_CLOUD_USER, ARTIFACTORY_CLOUD_PASS  - Adobe Artifactory (.github/scripts/settings.xml)
#   NPM_TOKEN                                        - npm publish
#   GPG_PRIVATE_KEY, GPG_PASSPHRASE                  - artifact signing
#   DEPLOY_QUERIES_SSH_KEY                            - deploy key with push access to
#                                                        adobe/commerce-cif-graphql-integration-reference

name: Release

on:
  push:
    tags:
      # Restrict releases to strict semver tags (rejecting -RC/-test/x.y.z.n); GitHub tag
      # filters are glob-only and match the whole ref, so [0-9]+ enforces the version shape.
      - 'core-cif-components-reactor-[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  build:
    name: build (gate)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # Pinned to v4 in all three jobs in this file, not v5: v5.5.0 generates a
      # settings.xml that force-disables Maven's interactive mode, with no opt-out.
      # deploy-queries.js's ci.parsePom() (below) relies on that interactive mode - it
      # pipes `printf '${project.groupId}|...'` into `mvn help:evaluate` (no
      # -Dexpression flag) specifically to grab it via the interactive prompt reading
      # from stdin. This job and `release` don't call that themselves, but are kept in
      # sync for consistency - revisit only alongside rewriting ci.js's Maven-invocation
      # mechanism, not by re-bumping this.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Build
        run: mvn -B clean install -Dskip-it

  release:
    name: release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Import GPG key
        run: echo "$GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Release
        # Only performs a 'mvn deploy' after the 'mvn release:prepare' because the tag is
        # already checked out.
        run: |
          echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" >> ~/.npmrc
          mvn -B -s .github/scripts/settings.xml clean deploy -P release-sign-artifacts,adobe-public -Dskip-it
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          ARTIFACTORY_CLOUD_USER: ${{ secrets.ARTIFACTORY_CLOUD_USER }}
          ARTIFACTORY_CLOUD_PASS: ${{ secrets.ARTIFACTORY_CLOUD_PASS }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

      - name: Clean up secrets
        if: always()
        run: |
          rm -rf ~/.gnupg
          rm -f ~/.npmrc

  deploy-queries:
    name: deploy-queries
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Generate Queries
        working-directory: bundles/core
        run: mvn -B clean verify

      - name: Set up deploy key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_QUERIES_SSH_KEY }}

      - name: Deploy Queries
        run: node --unhandled-rejections=strict .github/scripts/deploy-queries.js
